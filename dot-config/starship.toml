format = "$username$hostname$directory$git_branch${custom.jj}$git_state$git_status$jobs$character"
right_format = "$cmd_duration"

[directory]
style = "bold blue"

[git_branch]
format = "[$branch]($style) "
style = "purple"
only_attached = true

[git_status]
format = "([(*$conflicted$untracked$modified$staged$renamed$deleted)](yellow)[$ahead_behind](bright-black) )"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"

[git_state]
style = "yellow"

[custom.jj]
when = "jj --ignore-working-copy root"
command = '''jj log --ignore-working-copy --no-graph --color never -r @ -T 'separate(" ", change_id.shortest(), bookmarks.join(" "), if(empty, "", "*"))' '''
format = "[$output]($style) "
style = "purple"

[jobs]
style = "bright-black"

[character]
success_symbol = "❯"
error_symbol = "[❯](red)"

[cmd_duration]
format = "[$duration]($style)"
style = "bright-black"
